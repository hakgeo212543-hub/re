<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>game</title>
    <style>
        #gameover_text {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(36px, 8vw, 100px);
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #fff;
    background: rgba(0, 0, 0, 0.6);
    animation: go_in 0.4s ease-out;
}
@keyframes go_in {
    from { opacity: 0; }
    to   { opacity: 1; }
}
        #start_screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    background: #D1CFCD;
    color: #222;
    text-align: center;
    transition: opacity 0.4s;
}
#start_screen.hide { opacity: 0; pointer-events: none; }

.start_title {
    margin: 0;
    font-size: clamp(36px, 8vw, 100px);
    font-weight: 800;
    letter-spacing: 0.1em;
}

.start_note {
    margin: 0;
    font-size: clamp(12px, 1.4vw, 18px);
    color: #555;
}

.start_btn {
    padding: 0.5em 2em;
    font-size: clamp(18px, 2.8vw, 34px);
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #fff;
    background: #222;
    border: none;
    border-radius: 0.3em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
}
.start_btn:hover:not(:disabled) { background: #000; }
.start_btn:active:not(:disabled) { transform: scale(0.96); }
.start_btn:disabled { background: #888; cursor: wait; }
body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #D1CFCD;   /* 남는 여백 색 */
        overflow: hidden;
}   
.stage {
        position: relative;
        aspect-ratio: 16 / 9;
        width: min(100vw, 100vh * 16 / 9);   /* 창 안에 꽉 차되 비율 유지 */
        container-type: size;                /* 안쪽에서 cqw/cqh 사용 가능 */
            
}
.target{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 
    position: absolute;
    right: 5.2cqw;
    top: 50%;

    width: 0;
    height: 0;
    z-index: 2;
}
.bear {
        position: absolute;
        right: 0cqw;
        top: 0cqw;

        width: auto;
        height: 35cqw;
        transform: translateY(-50%) scaleX(-1);

        filter: drop-shadow(0cqw 0cqw 0.6cqw rgba(0, 0, 0, 1));
        transition: filter 1.5s;
}  
.bear_bar{
    position: absolute;
    left: 20cqw;
    top: 2cqw;

    width: 60cqw;
    height: 3cqw;

    border: 0.4cqw solid #333;

}
.bear_health{
    position: absolute;
    left: 20.4cqw;
    top: 2.4cqw;
     
    width: 60cqw;
    height: 3cqw;

    background-color: red;

}
.fire{
    position: absolute;
    width: 10cqw;
    height: 12cqw;
    transform: scaleX(-1.5) scaleY(1.5);
    right: 150cqw;

    filter: drop-shadow(0cqw 0cqw 1cqw rgba(255, 60, 0, 0.678));
}
.minam{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 
        position: absolute;      /* 스크롤해도 왼쪽에 고정 */
        left: 5.2cqw;
        top: 15.5cqw;               /* 세로 위치는 필요에 따라 조절 */
        width: auto;   /* 화면 너비의 1/6 */
        height: 50cqh;             /* 화면 높이의 1/2 */
        object-fit: cover;
        
        filter: drop-shadow(-0.5cqw 0.8cqw 0.6cqw rgba(255, 1, 179, 0.5));
        transition: filter 0.1s;

        z-index: 1;
}   
.may{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 

    position: absolute;

    width: 10cqw;
    height: auto;

    bottom: 22cqh;
    left: -100cqw;

    filter: drop-shadow(0cqw 0cqw 1cqw rgba(249, 253, 0, 0.5));

    transform: scaleX(-1);

    z-index: 10;
}
.liv{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 

    position: absolute;

    width: 10cqw;
    height: auto;

    bottom: 50cqh;
    left: -50cqw;

    filter: drop-shadow(0cqw 0cqw 1cqw rgba(255, 151, 241, 0.5));

    z-index: 11;
}
.zena{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 

    position: absolute;

    width: 10cqw;
    height: auto;

    bottom: 22cqh;
    left: -50cqw;

    filter: drop-shadow(0cqw 0cqw 1cqw rgba(255, 0, 221, 0.5));

    z-index: 20;
}
.word {
    position: absolute;
    left: 0;
    bottom: 0;
    color: white;
    font-weight: bold;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    z-index: 15;
}
.text{
        position:absolute;
        left: 0;
        top: 0;
        color: rgb(247, 0, 255);
        text-shadow:
        -1px -1px 0 #000,  1px -1px 0 #000,
        -1px  1px 0 #000,  1px  1px 0 #000,
         0 0 0.6cqw #000;
}  
.member_key{
    position:absolute;
    top: 0;
    right: 0;
    color: rgb(247, 0, 255);
    text-shadow:
        -1px -1px 0 #000,  1px -1px 0 #000,
        -1px  1px 0 #000,  1px  1px 0 #000,
         0 0 0.6cqw #000;
}
.pop {
        animation: pop 0.1s ease-out;
}

@keyframes pop {
        0%   { scale: 1; }
        30%  { scale: 0.9; }    /* 순간 약간 작아짐 */
        100% { scale: 1; }      /* 원래 크기로 복귀 */
}  
.keys {
    position: absolute;
    left: 5vw;
    bottom: 5vw;

    display: flex;
    gap: 3vw;
    z-index: 100;
}     
.key {
    
    width: 10vw;
    height: 10vh;

    

    border: 0.4vw solid rgba(12, 12, 12, 0.1);
    border-radius: 1vw;

    
    background-color: rgba(68, 68, 68, 0.2);

    color:aliceblue;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 24px;
    font-weight: bold;
    
    
}

.space {
    width: 34vw;
}
    </style>
    
</head>
<body>
    <div id="start_screen">
        <h1 class="start_title">GGUBLOCK</h1>
        <p class="start_note"></p>
        <button id="start_btn" class="start_btn" disabled>LOADING...</button>
    </div>
    <div class="stage">
    <div class="text">
        <p id="key_list">list:</p>             
    </div>
    <div class="member_key">
        <p id="woni_key">woni:a-s-k-l</p>
        <p id="may_key">may:k-k-s-l-k</p>
        <p id="liv_key">liv:l-l-a-s-k</p>
        <p id="zena_key">zena:a-k-s-l-k</p>
    </div>  

    <div class="bear_bar"></div>
    <div class="bear_health" id="health"></div>
    
    <div id="target" class="target">
        <img id="bear" class="bear" src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/bear_walk0.png">
        <img id="fire" class="fire" src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/fire1.png">
    </div>

    <img
        class="minam" 
        id="minam"
        src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/a.png"
    >

    <img
        class="may" 
        id="may"
        src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/may1.png"
    >

    <img class = "liv" id="liv" src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/liv.png">
    <img class="zena" id="zena" src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/zena1.png">

    </div>
    <div class="keys">
        <div id="a" class="key" onclick="tab_down('a')">A</div>
        <div id="s" class="key" onclick="tab_down('s')">S</div>
        <div id="space" class="key space" onclick="tab_down('space')">SPACE</div>
        <div id="k" class="key" onclick="tab_down('k')">K</div>
        <div id="l" class="key" onclick="tab_down('l')">L</div>
    </div>

    <!-- --------------------------------------------------------------------------------------------------------------------------------------------------- -->
    <script>
        const BASE = "https://raw.githubusercontent.com/hakgeo212543-hub/re/img/";
        const poseMap = {
            KeyA: "a",
            KeyS: "s",
            KeyK: "k",
            KeyL: "l",
            Space: "space"
        };

    //sound
        const sounds = {
          fire: new Audio("https://raw.githubusercontent.com/hakgeo212543-hub/re/sounds/pha.wav")
        };
        
        Object.values(sounds).forEach(s => {
          s.preload = "auto";
          s.load();
        });

    //bgm
        
        const bgm1 = new Audio("https://raw.githubusercontent.com/hakgeo212543-hub/re/sounds/BGM1.mp3");
        const bgm2 = new Audio("https://raw.githubusercontent.com/hakgeo212543-hub/re/sounds/BGM2.mp3");

        bgm1.preload = "auto";
        bgm2.preload = "auto";

        bgm1.addEventListener("ended", () => {
          bgm2.currentTime = 0;
          bgm2.play();
        });
        bgm2.addEventListener("ended", () => {
          bgm1.currentTime = 0;
          bgm1.play();
        });
        
        let bgmStarted = false;

        document.addEventListener("keydown", () => {
          if (bgmStarted) return;
          bgmStarted = true;
          bgm1.play();
        });



        let time_level = 1;
        let is_gameover = false;

        const stage = document.querySelector(".stage");

        const p = document.getElementById("key");
        const keys = document.getElementById("key_list");
        const minam = document.getElementById("minam");
        const fire = document.getElementById("fire");
        const may = document.getElementById("may");
        const liv = document.getElementById("liv");

        let key_list = [];
        let key_save = [];
        
        
        //cooldown
        let fire_cool = false;
        let may_cool = false;
        let liv_cool = false;
        let zena_cool = false;

        //member lvl
        let fire_lvl = 1;
        let may_lvl = 1;
        let liv_lvl = 1;
        let zena_lvl = 1;
        
        //invisible
        setInterval(() =>{
            if(liv_cool == false){
                liv.style.opacity = 0;
            }
            else if(liv_cool == true){
                liv.style.opacity = 1;
            }
            if(fire_cool == false){
                fire.style.opacity = 0;
            }
            else if(fire_cool == true){
                fire.style.opacity = 1;
            }
            if(may_cool == false){
                may.style.opacity = 0;
            }
            else if(may_cool == true){
                may.style.opacity = 1;
            }
            if(zena_cool == false){
                zena.style.opacity = 0;
            }
            else if(zena_cool == true){
                zena.style.opacity = 1;
            }
        })

        //pause
        let pause = true;

        
        // 미리 불러오기: 새 Image 객체로 캐시에 저장
        const preloaded = [];
        const preload_jobs = [];
            
        function preload(src){
            const img = new Image();
            img.src = src;
            preload_jobs.push(img.decode().catch(() => {}));
            preloaded.push(img);
        }
        
        Object.values(poseMap).forEach(name => preload(`${BASE}${name}.png`));
        for (let i = 1; i <= 4; i++) preload(`${BASE}fire${i}.png`);
        for (let i = 1; i <= 3; i++) preload(`${BASE}may${i}.png`);
        for (let i = 1; i <= 3; i++) preload(`${BASE}zena${i}.png`);
        for (let i = 0; i <= 3; i++) preload(`${BASE}bear_walk${i}.png`);
        preload(`${BASE}bear_hit.png`);
        preload(`${BASE}liv.png`);
        
        // ------- 시작 화면 -------
        const start_screen = document.getElementById("start_screen");
        const start_btn = document.getElementById("start_btn");
        let started = false;
        
        // 이미지가 다 불러와지거나, 8초가 지나면 버튼 활성화
        Promise.race([Promise.all(preload_jobs), sleep_ms(8000)]).then(() => {
            start_btn.disabled = false;
            start_btn.textContent = "START";
        });
        function sleep_ms(ms){ return new Promise(r => setTimeout(r, ms)); }
        
        function start_game(){
            if (started || start_btn.disabled) return;
            started = true;
            start_screen.classList.add("hide");
            setTimeout(() => start_screen.remove(), 500);
            unpause_F();                        // pause=false + 곰 이동 시작
        }
        start_btn.addEventListener("click", start_game);
        document.addEventListener("keydown", e => {
            if (!started && (e.code === "Enter" || e.code === "Space")) {
                e.preventDefault();
                start_game();
            }
        });

        

        function popImage(target) {
            const el = typeof target === "string" ? document.getElementById(target) : target;
            if (!el) return;
            el.classList.remove("pop");
            void el.offsetWidth;
            el.classList.add("pop");
            minam.style.filter = `drop-shadow(-0.5cqw 0.8cqw 10cqw rgba(255, 1, 179, 0.5))`;
            setTimeout(() =>{
                minam.style.filter = `drop-shadow(-0.5cqw 0.8cqw 0.6cqw rgba(255, 1, 179, 0.5))`;
            },50);
        }
        //touch--------------------------------------------------------------
        function tab_down(tab_key){
            if(is_gameover == false && pause == false){
                // p.textContent = `key:${tab_key}`;
                if (tab_key == "space") {
                    popImage(space);
                    key_save = key_list;
                    key_list = [];
                    keys.textContent = "list:" + key_list;
                }
                 
                const pose = tab_key;          // 한글/대문자 상태에서도 동작
                if (pose) {
                    popImage(pose);
                    if(tab_key != "space"){
                        key_list.push(tab_key);
                    }
                        keys.textContent = "list:" + key_list;
                    popImage(minam);
                    minam.src = `${BASE}${pose}.png`;
                }
            
                if (JSON.stringify(key_save) === JSON.stringify(["a", "s", "k", "l"])){
                    if(fire_cool == false){
                        fire_trigger(); 
                    }
                    else{
                        key_save = [];
                    }          
                }
                if (JSON.stringify(key_save) === JSON.stringify(["k", "k", "s", "l", "k"])){
                    if(may_cool == false){
                        may_trigger(); 
                    }
                    else{
                        key_save = [];
                    }          
                }
                if (JSON.stringify(key_save) === JSON.stringify(["l", "l", "a", "s", "k"])){
                    if(liv_cool == false){
                        liv_trigger(); 
                    }
                    else{
                        key_save = [];
                    }          
                }
                if (JSON.stringify(key_save) === JSON.stringify(["a", "k", "s", "l", "k"])){
                    if(zena_cool == false){
                        zena_trigger(); 
                    }
                    else{
                        key_save = [];
                    }          
                }
            }
        }
        //---------------------------------------------------------------
        //keyboard--------------------------------------------------------
        document.addEventListener("keydown", function (event) {
          if(is_gameover == false && pause == false){
            if (event.repeat) return;                  // 꾹 누름 방지
            if (event.code === "Space") event.preventDefault();

            // p.textContent = `key:${event.key}`;
            
            if (event.code === "Space") {
                popImage(space);
                key_save = key_list;
                key_list = [];
                keys.textContent = "list:" + key_list;
                
            } 
            const pose = poseMap[event.code];          // 한글/대문자 상태에서도 동작
            if (pose) {
                popImage(pose);
                if(event.code != "Space"){
                    key_list.push(event.key);
                }
                keys.textContent = "list:" + key_list;
                popImage(minam);
                minam.src = `${BASE}${pose}.png`;
            }
            
            if (JSON.stringify(key_save) === JSON.stringify(["a", "s", "k", "l"])){
                if(fire_cool == false){
                    fire_trigger(); 
                }
                else{
                    key_save = [];
                }          
            }
            if (JSON.stringify(key_save) === JSON.stringify(["k", "k", "s", "l", "k"])){
                if(may_cool == false){
                    may_trigger(); 
                }
                else{
                    key_save = [];
                }          
            }
            if (JSON.stringify(key_save) === JSON.stringify(["l", "l", "a", "s", "k"])){
                if(liv_cool == false){
                    liv_trigger(); 
                }
                else{
                    key_save = [];
                }          
            }
            if (JSON.stringify(key_save) === JSON.stringify(["a", "k", "s", "l", "k"])){
                if(zena_cool == false){
                    zena_trigger(); 
                }
                else{
                    key_save = [];
                }          
            }
          } 
        });
        // attact
        let is_hit = false;
        // fire-----------------------------------------------------------------------------
        function fire_trigger(){
            fire_cool = true;
            
            
            key_save = [];
            let fire_x = 150;
            const timer = setInterval(() => {
                fire_x = fire_x - 7;
                fire.style.right = fire_x+"cqw";                   // 1cqw씩 이동
                if (fire_x < 20){
                    clearInterval(timer);
                    fire_img(fire_x);
                    sounds.fire.currentTime = 0;
                    sounds.fire.play();
                }
            }, 16);
            
        }
        function fire_img(fire_x){
            let frame = 1;
            
            const timer = setInterval(() => {
                frame = frame+1;
                fire.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/fire${frame}.png`;
                
                if(frame == 3 || frame == 4){
                    kb(1*fire_lvl);
                }
                if(frame == 8){
                    fire_back(fire_x);
                    
                    clearInterval(timer);
                }
                else if(frame >= 5){              
                    fire.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/fire1.png`;
                }
                
            }, 80);
        }
        function fire_back(fire_x){
            const timer = setInterval(() => {
                let frame = 1;
                fire.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/fire${frame}.png`;
                fire_x = fire_x + 7;
                fire.style.right = fire_x+"cqw";                   // 1cqw씩 이동
                if (fire_x > 150){
                    clearInterval(timer);
                    fire_cool = false;
                }
            }, 16);
            
            
        }
        setInterval(() => {
            let woni_key = document.getElementById("woni_key");
            if(fire_cool == false){
                woni_key.style.color = "rgb(247, 0, 255)";
            }
            else{
                woni_key.style.color = "gray";
            }
        }, 16);
        // ----------------------------------------------------------------------------------
        //may-------------------------------------------------------------------------------
        function may_trigger(){
            may_cool = true;
            
            
            key_save = [];
            let may_x = -100;
            
            const timer = setInterval(() => {
                may_x = Math.min(may_x + 7, 10);
                may.style.left = may_x+"cqw";                
                if (may_x == 10){
                    clearInterval(timer);
                    play_lines(lines);
                    may_img(may_x);
                }
            }, 16);
            
        }
        function may_img(may_x){
            let frame = 1;
            let times = 0;
            const timer = setInterval(() => {
                frame = (frame+1)%3+1;
                times = times + 1;
                may.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/may${frame}.png`;
                
                if(frame == 3){
                    
                    kb(1*may_lvl);
                }
                if(times == 30){
                    
                    may_back(may_x);
                    stop_lines();
                    clearInterval(timer);
                }
                
                
            }, 100);
        }
        function may_back(may_x){
            const timer = setInterval(() => {
                may_x = may_x - 7;
                may.style.left = may_x+"cqw";                   
                if (may_x < -100){
                    clearInterval(timer);
                    may_cool = false;
                }
            }, 16);
            
            
        }
        setInterval(() => {
            let may_key = document.getElementById("may_key");
            if(may_cool == false){
                may_key.style.color = "rgb(247, 0, 255)";
            }
            else{
                may_key.style.color = "gray";
            }
        }, 16);
        //----------------------------------------------------------------------------------
        //liv----------------------------------------------------------------
        function liv_trigger(){
            liv_cool = true;
            key_save = [];
            let liv_angle = 0;
            let liv_x = -30;
            let liv_y = 50;
            const timer = setInterval(() => {
                liv_angle += 100.7;
                liv.style.rotate = liv_angle+"deg";

                liv_x = Math.min(liv_x+2, 20);
                liv.style.left =  liv_x + "cqw";

                liv_y = -(8/81)*(liv_x+7.5)**2 + 100;
                liv.style.bottom = liv_y+"cqh";
                if(liv_x == 20){
                    liv_angle = 0;
                    liv.style.rotate = liv_angle+"deg";
                    clearInterval(timer);
                    plasma(liv, { reach: () => reach_to(liv, bear_img) });
                    liv_back(liv_x);
                }
            },16);
        }
        function liv_back(liv_x){
            const timer = setInterval(() =>{
                liv_x = Math.max(liv_x-0.5, -30);
                liv.style.left =  liv_x + "cqw";
                if((liv_x**2)%5 == 0) kb(1*liv_lvl);
                if(liv_x == -30){
                    clearInterval(timer);
                    liv_cool = false;
                }
            },16);
            
        }
        setInterval(() => {
            let liv_key = document.getElementById("liv_key");
            if(liv_cool == false){
                liv_key.style.color = "rgb(247, 0, 255)";
            }
            else{
                liv_key.style.color = "gray";
            }
        }, 16);
        //-------------------------------------------------------------------
        
        
        //zena------------------------
        function zena_trigger(){
            zena_cool = true;
            
            
            key_save = [];
            let zena_x = -20;
            
            const timer = setInterval(() => {
                zena_x = Math.min(zena_x + 0.5, 15);
                zena.style.left = zena_x+"cqw";                
                if (zena_x == 15){
                    clearInterval(timer);
                    // play_lines(lines);
                    setTimeout(() =>{
                        zena_img(zena_x);
                    },500);
                    
                }
            }, 16);
            
        }

        function zena_img(zena_x){
            let frame = 1;
            let peak = false;
            let times = 0;
            const timer = setInterval(() => {
                if(frame == 3){
                    peak = true;
                }
                if(peak == false){
                    frame = frame+1;
                }
                else{
                    frame -= 1;
                }
                
                times = times + 1;
                zena.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/zena${frame}.png`;
                
                // if(times == 1){

                // }
                if(times == 4){
                    clearInterval(timer);
                    slash(document.getElementById("bear"), 5);  
                    setTimeout(() =>{
                        zena_back(zena_x);
                    },1000);
                }
                
                
            }, 80);
        }

        function zena_back(zena_x){
            const timer = setInterval(() => {
                zena_x = Math.max(zena_x - 0.5, -50);
                zena.style.left = zena_x+"cqw";                   
                if (zena_x == -50){
                    clearInterval(timer);
                    zena_cool = false;
                    
                }
            }, 16);
        }

        setInterval(() => {
            let zena_key = document.getElementById("zena_key");
            if(zena_cool == false){
                zena_key.style.color = "rgb(247, 0, 255)";
            }
            else{
                zena_key.style.color = "gray";
            }
        }, 16);


        //ceo-------------------------------------------------------------------------------
        let bear_x = 5.2;
        let bear = document.getElementById("target");
        let width = 60;
        let lvl = 1;
        let hit_timer = null;
        function kb(dmg){
            if(pause || is_gameover) return;
            if(!is_hit && !pause){
                term = 0;
                hit_timer = setInterval(() => {
                    term = term + 1;
                    
                    bear_img.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/bear_hit.png`;
                    if(term == 2){ 
                        clearInterval(hit_timer);
                        is_hit = false;
                    }
                },30);
            }
            
            is_hit = true;
            if(bear_x - 2 > 1){
                bear_x = bear_x - 2;
                target.style.right = bear_x+"cqw";
            }
            
            damage(dmg);
        }
        function damage(dmg){
            if(pause || is_gameover) return;
            let health = document.getElementById("health");
            
            width-=dmg/lvl;
            if(width<=0){
                next_lvl();
            }
            health.style.width = width+"cqw";
        }
        let bear_img = document.getElementById("bear");
        let bear_img_frame = 1
        let bear_timer = null;
        let bear_frame_timer = null;
        
        function bear_moving(){
            bear_timer = setInterval(() => {
                time_level = time_level + 0.01;
                bear_x = bear_x + (1.3*time_level);
                target.style.right = bear_x+"cqw";
            
                if(bear_x > 70){
                    gameover();
                    clearInterval(bear_timer);
                }
            },300);
            
        
        
            
            bear_frame_timer = setInterval(() => {
                if(is_hit == false){
                    bear_img_frame = (bear_img_frame + 1)%4;
                    bear_img.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/bear_walk${bear_img_frame}.png`;
                    if(bear_x > 70){
                        clearInterval(bear_frame_timer);
                    }
                }
            },300);
        
        }
        // bear_moving();
        //-------------------------------------------------------------------------------
        
        //gameover-----------------------------------------------------------------------
        function gameover(){
            if (is_gameover) return;          // 중복 호출 방지
            is_gameover = true;
            clearInterval(bear_timer);
            clearInterval(bear_frame_timer);
                
            const go = document.createElement("div");
            go.id = "gameover_text";
            go.textContent = "GAME OVER";
            document.body.appendChild(go);
                
            setTimeout(() => location.reload(), 1800);   // 시작 화면으로 복귀
        }
        //------------------------------------------------------------------
        //level-------------------------------------------------------------
        function next_lvl(){
            if(pause) return
            pause_F();
            lvl+=1;

            bear_x = 5.2;
            target.style.right = bear_x+"cqw";

            time_level = 1;

            width = 60;
            health.style.width = width+"cqw";

            clearInterval(hit_timer);
            is_hit = false;
            bear_img_frame = 0;
            bear_img.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/bear_walk${bear_img_frame}.png`;

            bear_img.style.filter = `drop-shadow(0cqw 0cqw ${lvl*2}cqw rgba(0, 0, 0, 1))`;

            setTimeout(() =>{
                unpause_F();
            },1500);
        }
        


        //pause
        function pause_F(){
            if(pause) return;
            pause = true;
            clearInterval(bear_timer);
            clearInterval(bear_frame_timer);
            
        }
        function unpause_F(){
            pause = false;
            bear_moving();
            
        }


        //-------------------------------------------------------------------------


        


        //may_functions-------------------------------------------------------------
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const rand = (min, max) => min + Math.random() * (max - min);
        // const colors = ["white", "#ffe14d", "#7df9ff", "#ff9bd2"];
        

        const lines = [
            "그거 아시죠? 배가 너무 고파 밥을 너무 빨리... 그렇다고 뭐 안 먹을 순 없잖아요 소고기 뭇국랑 그 스팸이랑"           
        ];

        let run_id = 0;     
        let word_timers = [];
        function throw_word(word){
            const el = document.createElement("div");
            el.className = "word";
            el.textContent = word;

            const may_left = (may.offsetLeft / stage.clientWidth) * 100;
            el.style.left = (may_left + 10) + "cqw";
            el.style.bottom = "30cqh";
            el.style.fontSize = rand(3, 6) + "cqw";
            el.style.color = "white";
            
            stage.appendChild(el);

            const dx   = rand(30, 90);
            const peak = rand(10, 35);
            const fall = rand(-10, 40);
            const rot  = rand(-540, 540);
            const time = rand(1200, 2200);

            const anim = el.animate([
                { transform: `translate(0, 0) scale(0.4)`, opacity: 0, easing: "ease-out" },
                { transform: `translate(${dx * 0.5}cqw, ${-peak}cqh)  scale(1.1)`, opacity: 1, offset: 0.4, easing: "ease-in" },
                { transform: `translate(${dx}cqw, ${fall}cqh)  scale(1)`, opacity: 1 }
            ], { duration: time, fill: "forwards" });

            anim.onfinish = () => el.remove();
            return time;
        }

        function fly_text(sentence, gap = 300){
            const words = sentence.split(/\s+/).filter(Boolean);
            words.forEach((word, i) => {
                const id = setTimeout(() => throw_word(word), i * gap + rand(0, 150));
                word_timers.push(id);       
            });
            return words.length * gap;
        }

        async function play_lines(list, gap = 120){
            const my_id = ++run_id;    
            for (const sentence of list){
                if (my_id !== run_id) return;   
                const t = fly_text(sentence, gap);
                await sleep(t + 2300);
            }
        }

        function stop_lines(){
            run_id++;                                  // 진행 중인 play_lines 무효화
            word_timers.forEach(clearTimeout);         // 아직 안 나온 글자 취소
            word_timers = [];
            document.querySelectorAll(".word").forEach(el => el.remove());   // 날아가는 글자 제거
        }

        //liv_functions---------------------------
        const SVG_NS = "http://www.w3.org/2000/svg";

        function plasma(from, opt = {}){
            const o = {
                speed: 4,          // 앞쪽 끝이 나아가는 속도 (cqw/프레임)
                reach: 90,         // 시작점에서 얼마나 멀리 뻗을지 (cqw)
                hold: 100,         // 끝까지 뻗은 뒤 유지 시간 (ms)
                seg: 2.5,          // 꺾임 간격 (cqw), 작을수록 잘게 꺾임
                jitter: 2.5,       // 위아래로 흔들리는 폭 (cqw)
                flicker: 40,       // 모양을 새로 뽑는 주기 (ms)
                color: "#7df9ff",  // 빛 색
                width: 0.8,        // 선 굵기
                bolts: 3,          // 겹치는 줄기 수 (첫 번째는 흰색 심지)
                ...opt
            };

            // 효과가 그려질 SVG (stage와 같은 16:9 비율, 가로 100 = 100cqw)
            const svg = document.createElementNS(SVG_NS, "svg");
            svg.setAttribute("viewBox", "0 0 100 56.25");
            svg.setAttribute("preserveAspectRatio", "none");
            svg.style.cssText =
                "position:absolute;left:0;top:0;width:100%;height:100%;" +
                "pointer-events:none;overflow:visible;z-index:12;" +
                `filter:drop-shadow(0 0 1cqw ${o.color});`;

            const lines = [];
            for (let i = 0; i < o.bolts; i++){
                const pl = document.createElementNS(SVG_NS, "polyline");
                pl.setAttribute("fill", "none");
                pl.setAttribute("stroke", i === 0 ? "#fff" : o.color);
                pl.setAttribute("stroke-width", i === 0 ? o.width * 0.5 : o.width);
                pl.setAttribute("stroke-linejoin", "round");
                pl.setAttribute("stroke-linecap", "round");
                pl.setAttribute("opacity", i === 0 ? 1 : 0.7);
                svg.appendChild(pl);
                lines.push(pl);
            }
            stage.appendChild(svg);

            let stopped = false;
            let resolve_done;
            const done = new Promise(r => resolve_done = r);

            function finish(){
                stopped = true;
                svg.remove();
                resolve_done();
            }

            // liv의 현재 위치에서 시작점 계산 (매 프레임 따라감)
            function start_point(){
                const s = stage.getBoundingClientRect();
                const r = from.getBoundingClientRect();
                return {
                    x: (r.left + r.width / 2 - s.left) / s.width * 100,
                    y: (r.top + r.height / 2 - s.top) / s.width * 100   // viewBox 높이 56.25 기준
                };
            }

            let length = 0;                 // 현재 뻗은 길이
            let reached_at = 0;             // 끝까지 뻗은 시각
            let last_shape = 0;
            let shapes = [];                // 줄기별 jitter 값 (flicker 주기마다 갱신)

            function new_shapes(count){
                shapes = lines.map(() =>
                    Array.from({ length: count }, () => rand(-1, 1)));
            }

            function frame(now){
                if (stopped) return;
                if (is_gameover){ finish(); return; }

                const p = start_point();

                // 매 프레임 reach를 새로 읽음 (숫자도, 함수도 가능)
                const reach = Math.max(0, typeof o.reach === "function" ? o.reach() : o.reach);

                if (length < reach){
                    length = Math.min(length + o.speed, reach);   // 모자라면 뻗음
                    reached_at = 0;                               // 아직 다 안 뻗음
                } else {
                    length = reach;                               // 넘치면 즉시 줄임
                    if (!reached_at) reached_at = now;            // 다 뻗은 시각 기록
                }

                const count = Math.ceil(length / o.seg) + 1;
                if (now - last_shape > o.flicker || shapes[0].length < count){
                    new_shapes(count);
                    last_shape = now;
                }

                lines.forEach((pl, b) => {
                const pts = [];
                    for (let i = 0; i < count; i++){
                        const x = p.x + Math.min(i * o.seg, length);
                        const y = p.y + (i === 0 ? 0 : shapes[b][i] * o.jitter);
                        pts.push(x.toFixed(2) + "," + y.toFixed(2));
                    }
                    pl.setAttribute("points", pts.join(" "));
                });

                if (reached_at){
                    const t = now - reached_at;
                    if (t > o.hold){ finish(); return; }
                    svg.style.opacity = t > o.hold - 200 ? (o.hold - t) / 200 : 1;
                } else {
                    svg.style.opacity = 1;                        // 다시 뻗는 중이면 선명하게
                }
                requestAnimationFrame(frame);
            }

            new_shapes(1);
            requestAnimationFrame(frame);

            return { done, stop: finish, opt: o };
        }
        function reach_to(from, target){
            const s = stage.getBoundingClientRect();
            const f = from.getBoundingClientRect();
            const t = target.getBoundingClientRect();
            return (t.left - (f.left + f.width / 2)) / s.width * 100 + 3;   // cqw
        }
        //-------------------------------------------------
        //zena function------------------------------------
        function slash(target, count = 3, interval = 120) {
          const parent = stage;
          const pr = parent.getBoundingClientRect();
          const tr = target.getBoundingClientRect();
                
          // bear 중심 좌표와 너비를 부모 기준 %로 변환
          const cx = ((tr.left - pr.left + tr.width / 2) / pr.width) * 100;
          const cy = ((tr.top - pr.top + tr.height / 2) / pr.height) * 100;
          const w = (tr.width / pr.width) * 100;
                
          for (let i = 0; i < count; i++) {
            setTimeout(() => {
              const s = document.createElement("div");
              const angle = (Math.random() < 0.5 ? -1 : 1) * (20 + Math.random() * 50);
              const dx = (Math.random() - 0.5) * w * 0.5; // bear 근처에서 살짝 흩어짐
              const dy = (Math.random() - 0.5) * w * 0.5;
            
              Object.assign(s.style, {
                position: "absolute",
                left: cx + dx + "%",
                top: cy + dy + "%",
                width: w * 1.4 + "%",
                aspectRatio: "16 / 1",
                borderRadius: "50%",
                background: "linear-gradient(90deg, transparent, #BFFFE6 50%, transparent)",
                filter: "drop-shadow(0 0 6px #8cf)",
                pointerEvents: "none",
                zIndex: 999,
              });
              parent.appendChild(s);
            
              s.animate(
                [
                  { transform: `translate(-50%,-50%) rotate(${angle}deg) scaleX(0.2)`, clipPath: "inset(0 100% 0 0)", opacity: 1 },
                  { transform: `translate(-50%,-50%) rotate(${angle}deg) scaleX(1)`,   clipPath: "inset(0 0 0 0)",    opacity: 1, offset: 0.4 },
                  { transform: `translate(-50%,-50%) rotate(${angle}deg) scaleX(1.1)`, clipPath: "inset(0 0 0 0)",    opacity: 0 },
                ],
                { duration: 280, easing: "ease-out" }
              ).onfinish = () => s.remove();
            
              // 맞는 느낌: bear 살짝 흔들기
              target.animate(
                [{ translate: "0 0" }, { translate: "-0.6cqw 0" }, { translate: "0.6cqw 0" }, { translate: "0 0" }],
                { duration: 120 }
              );
              kb(1.5*zena_lvl);
            }, i * interval);
          }
        }
    </script>
