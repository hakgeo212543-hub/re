<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>game</title>
    <style>
        body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;   /* 남는 여백 색 */
        overflow: hidden;
}   
.stage {
        position: relative;
        aspect-ratio: 16 / 9;
        width: min(100vw, 100vh * 16 / 9);   /* 창 안에 꽉 차되 비율 유지 */
        container-type: size;                /* 안쪽에서 cqw/cqh 사용 가능 */
            
}
.target{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 
    position: absolute;
    right: 5.2cqw;
    top: 50%;

    width: 0;
    height: 0;
    z-index: 2;
}
.bear {
        position: absolute;
        right: 0cqw;
        top: 0cqw;

        width: auto;
        height: 35cqw;
        transform: translateY(-50%) scaleX(-1);

        filter: drop-shadow(-0.5cqw 0.8cqw 0.6cqw rgba(231, 231, 231, 0.5));
}  
.fire{
    position: absolute;
    width: 10cqw;
    height: 12cqw;
    transform: scaleX(-1.5) scaleY(1.5);
    right: 150cqw;

    filter: drop-shadow(0cqw 0cqw 1cqw rgba(255, 60, 0, 0.678));
}
.minam{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 
        position: absolute;      /* 스크롤해도 왼쪽에 고정 */
        left: 5.2cqw;
        top: 15.5cqw;               /* 세로 위치는 필요에 따라 조절 */
        width: auto;   /* 화면 너비의 1/6 */
        height: 50cqh;             /* 화면 높이의 1/2 */
        object-fit: cover;
        
        filter: drop-shadow(-0.5cqw 0.8cqw 0.6cqw rgba(231, 231, 231, 0.5));

        z-index: 1;
}   
.may{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 

    position: absolute;

    width: 10cqw;
    height: auto;

    bottom: 22cqh;
    left: -100cqw;

    filter: drop-shadow(0cqw 0cqw 1cqw rgba(249, 253, 0, 0.5));

    transform: scaleX(-1);

    z-index: 10;
}
.word {
    position: absolute;
    left: 0;
    bottom: 0;
    color: white;
    font-weight: bold;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    z-index: 15;
}
.text{
        position:absolute;
        left: 0;
        top: 0;
        color: aqua;
}  
.member_key{
    position:absolute;
    top: 0;
    right: 0;
    color: aqua;
}
.pop {
        animation: pop 0.1s ease-out;
}

@keyframes pop {
        0%   { scale: 1; }
        30%  { scale: 0.9; }    /* 순간 약간 작아짐 */
        100% { scale: 1; }      /* 원래 크기로 복귀 */
}  
.keys {
    position: absolute;
    left: 5vw;
    bottom: 5vw;

    display: flex;
    gap: 3vw;
}     
.key {
    
    width: 10vw;
    height: 10vh;

    

    border: 0.4vw solid #333;
    border-radius: 1vw;

    
    background-color: rgba(200, 200, 200, 0.1);

    color:aliceblue;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 24px;
    font-weight: bold;
    
    
}

.space {
    width: 34vw;
}
    </style>
    
</head>
<body>
    <div class="stage">
    <div class="text">
        <p id="key_list">list:</p>             
    </div>
    <div class="member_key">
        <p id="woni">woni:a-s-k-l</p>
    </div>  
    
    <div id="target" class="target">
        <img id="bear" class="bear" src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/bear_walk0.png">
        <img id="fire" class="fire" src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/fire1.png">
    </div>

    <img
        class="minam" 
        id="minam"
        src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/a.png"
    >

    <img
        class="may" 
        id="may"
        src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/may1.png"
    >

    </div>
    <div class="keys">
        <div id="a" class="key" onclick="tab_down('a')">A</div>
        <div id="s" class="key" onclick="tab_down('s')">S</div>
        <div id="space" class="key space" onclick="tab_down('space')">SPACE</div>
        <div id="k" class="key" onclick="tab_down('k')">K</div>
        <div id="l" class="key" onclick="tab_down('l')">L</div>
    </div>

    <!-- --------------------------------------------------------------------------------------------------------------------------------------------------- -->
    <script>
        const BASE = "https://raw.githubusercontent.com/hakgeo212543-hub/re/img/";
        const poseMap = {
            KeyA: "a",
            KeyS: "s",
            KeyK: "k",
            KeyL: "l",
            Space: "space"
        };
        

        let is_gameover = false;

        const stage = document.querySelector(".stage");

        const p = document.getElementById("key");
        const keys = document.getElementById("key_list");
        const minam = document.getElementById("minam");
        const fire = document.getElementById("fire");
        const may = document.getElementById("may");

        let key_list = [];
        let key_save = [];
        
        
        //cooldown
        let fire_cool = false;
        let may_cool = false;


        
        // 미리 불러오기: 새 Image 객체로 캐시에 저장
        const preloaded = []; 
        Object.values(poseMap).forEach(name => {
            const img = new Image();
            img.src = `${BASE}${name}.png`;
            img.decode().catch(() => {});   // 미리 디코딩
            preloaded.push(img);
        });

        for (let i = 1; i <= 4; i++) {
            const img = new Image();
            img.src = `${BASE}fire${i}.png`;
            img.decode().catch(() => {});   // 미리 디코딩
            preloaded.push(img);
        }

        

        function popImage(target) {
            const el = typeof target === "string" ? document.getElementById(target) : target;
            if (!el) return;
            el.classList.remove("pop");
            void el.offsetWidth;
            el.classList.add("pop");
        }
        //touch--------------------------------------------------------------
        function tab_down(tab_key){
            if(is_gameover == false){
                // p.textContent = `key:${tab_key}`;
                if (tab_key == "space") {
                    popImage(space);
                    key_save = key_list;
                    key_list = [];
                    keys.textContent = "list:" + key_list;
                }
                 
                const pose = tab_key;          // 한글/대문자 상태에서도 동작
                if (pose) {
                    popImage(pose);
                    if(tab_key != "space"){
                        key_list.push(tab_key);
                    }
                        keys.textContent = "list:" + key_list;
                    popImage(minam);
                    minam.src = `${BASE}${pose}.png`;
                }
            
                if (JSON.stringify(key_save) === JSON.stringify(["a", "s", "k", "l"])){
                    if(fire_cool == false){
                        fire_trigger(); 
                    }
                    else{
                        key_save = [];
                    }          
                }
            }
        }
        //---------------------------------------------------------------
        //keyboard--------------------------------------------------------
        document.addEventListener("keydown", function (event) {
          if(is_gameover == false){
            if (event.repeat) return;                  // 꾹 누름 방지
            if (event.code === "Space") event.preventDefault();

            // p.textContent = `key:${event.key}`;
            
            if (event.code === "Space") {
                popImage(space);
                key_save = key_list;
                key_list = [];
                keys.textContent = "list:" + key_list;
                
            } 
            const pose = poseMap[event.code];          // 한글/대문자 상태에서도 동작
            if (pose) {
                popImage(pose);
                if(event.code != "Space"){
                    key_list.push(event.key);
                }
                keys.textContent = "list:" + key_list;
                popImage(minam);
                minam.src = `${BASE}${pose}.png`;
            }
            
            if (JSON.stringify(key_save) === JSON.stringify(["a", "s", "k", "l"])){
                if(fire_cool == false){
                    fire_trigger(); 
                }
                else{
                    key_save = [];
                }          
            }
            if (JSON.stringify(key_save) === JSON.stringify(["k", "k", "s", "l", "k"])){
                if(may_cool == false){
                    may_trigger(); 
                }
                else{
                    key_save = [];
                }          
            }
          } 
        });
        // attact
        let is_hit = false;
        // fire-----------------------------------------------------------------------------
        function fire_trigger(){
            fire_cool = true;
            
            
            key_save = [];
            let fire_x = 150;
            const timer = setInterval(() => {
                fire_x = fire_x - 7;
                fire.style.right = fire_x+"cqw";                   // 1cqw씩 이동
                if (fire_x < 20){
                    clearInterval(timer);
                    fire_img(fire_x);
                }
            }, 16);
            
        }
        function fire_img(fire_x){
            let frame = 1;
            
            const timer = setInterval(() => {
                frame = frame+1;
                fire.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/fire${frame}.png`;
                
                if(frame == 3 || frame == 4){
                    kb();
                }
                if(frame == 8){
                    fire_back(fire_x);
                    
                    clearInterval(timer);
                }
                else if(frame >= 5){              
                    fire.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/fire1.png`;
                }
                
            }, 80);
        }
        function fire_back(fire_x){
            const timer = setInterval(() => {
                frame = 1;
                fire.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/fire${frame}.png`;
                fire_x = fire_x + 7;
                fire.style.right = fire_x+"cqw";                   // 1cqw씩 이동
                if (fire_x > 150){
                    clearInterval(timer);
                    fire_cool = false;
                }
            }, 16);
            
            
        }
        // ----------------------------------------------------------------------------------
        //may-------------------------------------------------------------------------------
        function may_trigger(){
            may_cool = true;
            
            
            key_save = [];
            let may_x = -100;
            
            const timer = setInterval(() => {
                may_x = Math.min(may_x + 7, 10);
                may.style.left = may_x+"cqw";                
                if (may_x == 10){
                    clearInterval(timer);
                    play_lines(lines);
                    may_img(may_x);
                }
            }, 16);
            
        }
        function may_img(may_x){
            let frame = 1;
            let times = 0;
            const timer = setInterval(() => {
                frame = (frame+1)%3+1;
                times = times + 1;
                may.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/may${frame}.png`;
                
                if(frame == 3){
                    
                    kb();
                }
                if(times == 30){
                    
                    may_back(may_x);
                    stop_lines();
                    clearInterval(timer);
                }
                
                
            }, 100);
        }
        function may_back(may_x){
            const timer = setInterval(() => {
                may_x = may_x - 7;
                may.style.left = may_x+"cqw";                   
                if (may_x < -100){
                    clearInterval(timer);
                    may_cool = false;
                }
            }, 16);
            
            
        }
        //----------------------------------------------------------------------------------
        //ceo-------------------------------------------------------------------------------
        let bear_x = 5.2;
        let bear = document.getElementById("target");
        function kb(){
            if(!is_hit){
                term = 0;
                const timer = setInterval(() => {
                    term = term + 1;
                    bear_img.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/bear_hit.png`;
                    if(term == 2){ 
                        clearInterval(timer);
                        is_hit = false;
                    }
                },30);
            }
            
            is_hit = true;
            bear_x = bear_x - 2;
            target.style.right = bear_x+"cqw";
        }
        const bear_timer = setInterval(() => {
            bear_x = bear_x + 1.3;
            target.style.right = bear_x+"cqw";
            
            if(bear_x > 70){
                gameover();
                clearInterval(bear_timer);
            }
        },300);
        let bear_img = document.getElementById("bear");
        
        
        frame = 1;
        const bear_frame_timer = setInterval(() => {
            if(is_hit == false){
                frame = (frame + 1)%4;
                bear_img.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/bear_walk${frame}.png`;
                if(bear_x > 70){
                    clearInterval(bear_frame_timer);
                }
            }
        },300);
        
        
        //-------------------------------------------------------------------------------
        
        //gameover-----------------------------------------------------------------------
        function gameover(){
            is_gameover = true;
        }
        //------------------------------------------------------------------
        //may_functions-------------------------------------------------------------
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const rand = (min, max) => min + Math.random() * (max - min);
        // const colors = ["white", "#ffe14d", "#7df9ff", "#ff9bd2"];
        

        const lines = [
            "그거 아시죠? 배가 너무 고파 밥을 너무 빨리... 그렇다고 뭐 안 먹을 순 없잖아요 소고기 뭇국랑 그 스팸이랑"           
        ];

        let run_id = 0;     
        let word_timers = [];
        function throw_word(word){
            const el = document.createElement("div");
            el.className = "word";
            el.textContent = word;

            const may_left = (may.offsetLeft / stage.clientWidth) * 100;
            el.style.left = (may_left + 10) + "cqw";
            el.style.bottom = "30cqh";
            el.style.fontSize = rand(3, 6) + "cqw";
            el.style.color = "white";
            
            stage.appendChild(el);

            const dx   = rand(30, 90);
            const peak = rand(10, 35);
            const fall = rand(-10, 40);
            const rot  = rand(-540, 540);
            const time = rand(1200, 2200);

            const anim = el.animate([
                { transform: `translate(0, 0) scale(0.4)`, opacity: 0, easing: "ease-out" },
                { transform: `translate(${dx * 0.5}cqw, ${-peak}cqh)  scale(1.1)`, opacity: 1, offset: 0.4, easing: "ease-in" },
                { transform: `translate(${dx}cqw, ${fall}cqh)  scale(1)`, opacity: 1 }
            ], { duration: time, fill: "forwards" });

            anim.onfinish = () => el.remove();
            return time;
        }

        function fly_text(sentence, gap = 300){
            const words = sentence.split(/\s+/).filter(Boolean);
            words.forEach((word, i) => {
                const id = setTimeout(() => throw_word(word), i * gap + rand(0, 150));
                word_timers.push(id);       
            });
            return words.length * gap;
        }

        async function play_lines(list, gap = 120){
            const my_id = ++run_id;    
            for (const sentence of list){
                if (my_id !== run_id) return;   
                const t = fly_text(sentence, gap);
                await sleep(t + 2300);
            }
        }

        function stop_lines(){
            run_id++;                                  // 진행 중인 play_lines 무효화
            word_timers.forEach(clearTimeout);         // 아직 안 나온 글자 취소
            word_timers = [];
            document.querySelectorAll(".word").forEach(el => el.remove());   // 날아가는 글자 제거
        }
        
    </script>
</body>
</html>
