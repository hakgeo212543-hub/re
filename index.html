<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>game</title>
    <style>
        @property --half {
    syntax: '<angle>';
    inherits: false;
    initial-value: 55deg;
}
@property --lit {
    syntax: '<number>';
    inherits: false;
    initial-value: 0;
}
#spotlight.lit { animation: spot_lit 0.6s ease-out; }
@keyframes spot_lit {
    from { --lit: var(--peak); }
    to   { --lit: 0; }
}
#spotlight {
    --hx: 15vw;       /* 밝아지는 영역 중심 (JS가 자동으로 맞춤) */
    --hy: 40vh;
    --hr: 30vmax;     /* 반지름 (JS가 자동으로 맞춤) */
    --hs: 10vmax;     /* 가장자리 부드러움 */
    --peak: 0.6;      /* 번쩍일 때 얼마나 밝아지는지 (JS가 바꿈) */
    -webkit-mask-image: radial-gradient(circle var(--hr) at var(--hx) var(--hy),
        rgba(0, 0, 0, calc(1 - var(--lit))) 0,
        rgba(0, 0, 0, calc(1 - var(--lit))) calc(var(--hr) - var(--hs)),
        #000 var(--hr));
    mask-image: radial-gradient(circle var(--hr) at var(--hx) var(--hy),
        rgba(0, 0, 0, calc(1 - var(--lit))) 0,
        rgba(0, 0, 0, calc(1 - var(--lit))) calc(var(--hr) - var(--hs)),
        #000 var(--hr));
    --half: 55deg;     /* 밝은 영역 반쪽 각도 (JS에서 조절) */
    --soft: 15deg;     /* 경계 부드러움 */
    position: fixed;
    inset: 0;
    z-index: 1000000001;
    pointer-events: none;
    background:
        linear-gradient(to bottom, transparent 55%, rgba(0, 0, 0, 0.35)),
        conic-gradient(
            from 0deg at var(--sx, 50%) -5%,
            rgba(0, 0, 0, 0.75) 0deg calc(180deg - var(--half) - var(--soft)),
            transparent calc(180deg - var(--half)) calc(180deg + var(--half)),
            rgba(0, 0, 0, 0.75) calc(180deg + var(--half) + var(--soft)) 360deg
        );
}
        #gameover_text {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(36px, 8vw, 100px);
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #fff;
    background: rgba(0, 0, 0, 0.6);
    animation: go_in 0.4s ease-out;
}
@keyframes go_in {
    from { opacity: 0; }
    to   { opacity: 1; }
}
        #start_screen {
    position: fixed;
    inset: 0;
    z-index: 1000000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    background: #D1CFCD;
    color: #222;
    text-align: center;
    transition: opacity 0.4s;
}
#start_screen.hide { opacity: 0; pointer-events: none; }

.start_title {
    margin: 0;
    font-size: clamp(36px, 8vw, 100px);
    font-weight: 800;
    letter-spacing: 0.1em;
}

.start_note {
    margin: 0;
    font-size: clamp(12px, 1.4vw, 18px);
    color: #555;
}

.start_btn {
    padding: 0.5em 2em;
    font-size: clamp(18px, 2.8vw, 34px);
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #fff;
    background: #222;
    border: none;
    border-radius: 0.3em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
}
.start_btn:hover:not(:disabled) { background: #000; }
.start_btn:active:not(:disabled) { transform: scale(0.96); }
.start_btn:disabled { background: #888; cursor: wait; }
body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #D1CFCD;   /* 남는 여백 색 */
        overflow: hidden;
}   
.stage {
        position: relative;
        aspect-ratio: 16 / 9;
        width: min(100vw, 100vh * 16 / 9);   /* 창 안에 꽉 차되 비율 유지 */
        container-type: size;                /* 안쪽에서 cqw/cqh 사용 가능 */
            
}
.target{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 
    position: absolute;
    right: 5.2cqw;
    top: 50%;

    width: 0;
    height: 0;
    z-index: 2;
    transition: right 0.5s;
}
.bear {
        position: absolute;
        right: 0cqw;
        top: 0cqw;

        width: auto;
        height: 35cqw;
        transform: translateY(-50%) scaleX(-1);

        filter: drop-shadow(0cqw 0cqw 0.6cqw rgba(0, 0, 0, 1));
        transition: filter 1.5s;

        z-index: 1;
        
}  
.bear_bar{
    position: absolute;
    left: 20cqw;
    top: 2cqw;

    width: 60cqw;
    height: 3cqw;

    border: 0.4cqw solid #333;

    z-index: 100000;

}
.bear_health{
    position: absolute;
    left: 20.4cqw;
    top: 2.4cqw;
     
    width: 60cqw;
    height: 3cqw;

    background-color: red;

    z-index: 100000;

}
.fire{
    position: absolute;
    width: 10cqw;
    height: 12cqw;
    transform: scaleX(-1.5) scaleY(1.5);
    right: 150cqw;

    filter: drop-shadow(0cqw 0cqw 1cqw rgba(255, 60, 0, 0.678));
}
.minam{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 
        position: absolute;      /* 스크롤해도 왼쪽에 고정 */
        left: 5.2cqw;
        top: 15.5cqw;               /* 세로 위치는 필요에 따라 조절 */
        width: auto;   /* 화면 너비의 1/6 */
        height: 50cqh;             /* 화면 높이의 1/2 */
        object-fit: cover;
        
        filter: drop-shadow(-0.5cqw 0.8cqw 0.6cqw rgba(255, 1, 179, 0.5));
        transition: filter 0.1s;

        z-index: 2;

        
}   
.may{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 

    position: absolute;

    width: 10cqw;
    height: auto;

    bottom: 22cqh;
    left: -100cqw;

    filter: drop-shadow(0cqw 0cqw 1cqw rgba(249, 253, 0, 0.5));

    transform: scaleX(-1);

    z-index: 10;
}
.liv{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 

    position: absolute;

    width: 10cqw;
    height: auto;

    bottom: 50cqh;
    left: -50cqw;

    filter: drop-shadow(0cqw 0cqw 1cqw rgba(255, 151, 241, 0.5));

    z-index: 11;

    
}
.zena{
    -webkit-user-drag: none;      /* 크롬/사파리 드래그 방지 */
    user-select: none;
    -webkit-touch-callout: none; 

    position: absolute;

    width: 10cqw;
    height: auto;

    bottom: 22cqh;
    left: -50cqw;

    filter: drop-shadow(0cqw 0cqw 1cqw rgba(255, 0, 221, 0.5));

    z-index: 20;
}
.word {
    position: absolute;
    left: 0;
    bottom: 0;
    color: white;
    font-weight: bold;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    z-index: 15;
}
.text{
        position:absolute;
        left: 0;
        top: 0;
        color: rgb(247, 0, 255);
        text-shadow:
        -1px -1px 0 #000,  1px -1px 0 #000,
        -1px  1px 0 #000,  1px  1px 0 #000,
         0 0 0.6cqw #000;

         z-index: 100000;
}  
.member_key{
    position:absolute;
    top: 0;
    right: 0;
    color: rgb(247, 0, 255);
    text-shadow:
        -1px -1px 0 #000,  1px -1px 0 #000,
        -1px  1px 0 #000,  1px  1px 0 #000,
         0 0 0.6cqw #000;

    
}
.pop {
        animation: pop 0.1s ease-out;
}

@keyframes pop {
        0%   { scale: 1; }
        30%  { scale: 0.9; }    /* 순간 약간 작아짐 */
        100% { scale: 1; }      /* 원래 크기로 복귀 */
}  
.keys {
    position: absolute;
    left: 5vw;
    bottom: 5vw;

    display: flex;
    gap: 3vw;
    z-index: 100;
}     
.key {
    
    width: 10vw;
    height: 10vh;

    

    border: 0.4vw solid rgba(12, 12, 12, 0.1);
    border-radius: 1vw;

    
    background-color: rgba(68, 68, 68, 0.2);

    color:aliceblue;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 24px;
    font-weight: bold;
    
    
}

.space {
    width: 34vw;
}

/* 이미지 순환 */
.marquee {
    position: relative;
    width: 100%;
    height: clamp(160px, 34vh, 380px);   /* 이미지 크기: 여기만 조절하면 됨 */
    overflow: hidden;
}
.marquee_img {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: auto;
    will-change: transform;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;

    transition: left 1s;
}

/* state */
.stat_panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2vh;
}
.stat_points {
    font-size: clamp(14px, 1.8vw, 24px);
    font-weight: 800;
    letter-spacing: 0.1em;
}
.stat_row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.2vw;
}
.stat_card {
    display: flex;
    align-items: center;
    gap: 0.6em;
    padding: 0.4em 0.8em;
    background: rgba(0, 0, 0, 0.08);
    border-radius: 0.5em;
    font-size: clamp(12px, 1.6vw, 20px);
    font-weight: 700;
}
.stat_name { min-width: 3.5em; text-align: left; }
.stat_lvl  { min-width: 3em; text-align: center; }
.stat_btn {
    width: 1.8em;
    height: 1.8em;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: #222;
    color: #fff;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
}
.stat_btn:hover:not(:disabled) { background: #000; }
.stat_btn:active:not(:disabled) { transform: scale(0.9); }
.stat_btn:disabled { background: #999; cursor: not-allowed; }
.minam_light {
    --mx: 15cqw;                  /* 빛이 시작되는 가로 위치 (minam 중앙쯤) */
    position: absolute;
    inset: 0;
    pointer-events: none;
}
.beam {
    position: absolute;
    left: calc(var(--mx) - 7cqw);
    top: 0;
    width: 14cqw;
    height: 46cqw;
    transform-origin: 50% 0;      /* 꼭짓점(위쪽 중앙)을 기준으로 회전 */
    clip-path: polygon(50% 0, 100% 100%, 0 100%);   /* 삼각형 */
    mix-blend-mode: screen;
    opacity: 0;                   /* 평소에는 꺼져 있음 */
    z-index: 1000000002;
}
.beam.pink  { transform: rotate(-16deg); background: linear-gradient(to bottom, rgba(255, 79, 216, 0.9), rgba(255, 79, 216, 0)); }
.beam.green { transform: rotate(0deg);   background: linear-gradient(to bottom, rgba(61, 255, 122, 0.9), rgba(61, 255, 122, 0)); }
.beam.blue  { transform: rotate(16deg);  background: linear-gradient(to bottom, rgba(77, 166, 255, 0.9), rgba(77, 166, 255, 0)); }

.beam.flash { animation: beam_flash 0.6s ease-out; }
@keyframes beam_flash {
    0%   { opacity: 1; }
    100% { opacity: 0; }
}
    </style>
    
</head>
<body>
    <div id="spotlight"></div>
    <div id="start_screen">
        <h1 class="start_title">GGUBLOCK</h1>
        <div class="marquee" id="marquee"></div>

        <div class="stat_panel">
            <div class="stat_points">POINT: <span id="stat_points">10</span></div>
            <div class="stat_row">
                <div class="stat_card">
                    <span class="stat_name">FIRE</span>
                    <button class="stat_btn" data-stat="fire" data-d="-1">−</button>
                    <span class="stat_lvl" id="stat_fire">Lv.1</span>
                    <button class="stat_btn" data-stat="fire" data-d="1">+</button>
                </div>
                <div class="stat_card">
                    <span class="stat_name">MAY</span>
                    <button class="stat_btn" data-stat="may" data-d="-1">−</button>
                    <span class="stat_lvl" id="stat_may">Lv.1</span>
                    <button class="stat_btn" data-stat="may" data-d="1">+</button>
                </div>
                <div class="stat_card">
                    <span class="stat_name">LIV</span>
                    <button class="stat_btn" data-stat="liv" data-d="-1">−</button>
                    <span class="stat_lvl" id="stat_liv">Lv.1</span>
                    <button class="stat_btn" data-stat="liv" data-d="1">+</button>
                </div>
                <div class="stat_card">
                    <span class="stat_name">ZENA</span>
                    <button class="stat_btn" data-stat="zena" data-d="-1">−</button>
                    <span class="stat_lvl" id="stat_zena">Lv.1</span>
                    <button class="stat_btn" data-stat="zena" data-d="1">+</button>
                </div>
            </div>
        </div>

        <button id="start_btn" class="start_btn" disabled>LOADING...</button>
    </div>
    <div class="stage">
    <div class="text">
        <p id="key_list">list:</p>             
    </div>
    <div class="member_key">
        <p id="woni_key">woni:a-s-k-l</p>
        <p id="may_key">may:k-k-s-l-k</p>
        <p id="liv_key">liv:l-l-a-s-k</p>
        <p id="zena_key">zena:a-k-s-l-k</p>
    </div>  

    <div class="bear_bar"></div>
    <div class="bear_health" id="health"></div>
    
    <div id="target" class="target">
        <img id="bear" class="bear" src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/bear_walk0.png">
        <img id="fire" class="fire" src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/fire1.png">
    </div>

    <img
        class="minam" 
        id="minam"
        src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/a.png"
    >
    <div class="minam_light">
        <div class="beam pink"></div>
        <div class="beam green"></div>
        <div class="beam blue"></div>
    </div>

    <img
        class="may" 
        id="may"
        src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/may1.png"
    >

    <img class = "liv" id="liv" src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/liv.png">
    <img class="zena" id="zena" src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/zena1.png">

    </div>
    <div class="keys">
        <div id="a" class="key" onclick="tab_down('a')">A</div>
        <div id="s" class="key" onclick="tab_down('s')">S</div>
        <div id="space" class="key space" onclick="tab_down('space')">SPACE</div>
        <div id="k" class="key" onclick="tab_down('k')">K</div>
        <div id="l" class="key" onclick="tab_down('l')">L</div>
    </div>

    <!-- --------------------------------------------------------------------------------------------------------------------------------------------------- -->
    <script>
        const BASE = "https://raw.githubusercontent.com/hakgeo212543-hub/re/img/";
        const poseMap = {
            KeyA: "a",
            KeyS: "s",
            KeyK: "k",
            KeyL: "l",
            Space: "space"
        };

    //sound
        const sounds = {
          fire: new Audio("https://raw.githubusercontent.com/hakgeo212543-hub/re/sounds/pha.wav")
        };
        
        Object.values(sounds).forEach(s => {
          s.preload = "auto";
          s.load();
        });

    //bgm
        
        const bgm1 = new Audio("https://raw.githubusercontent.com/hakgeo212543-hub/re/sounds/BGM1.mp3");
        const bgm2 = new Audio("https://raw.githubusercontent.com/hakgeo212543-hub/re/sounds/BGM2.mp3");

        bgm1.preload = "auto";
        bgm2.preload = "auto";

        bgm1.addEventListener("ended", () => {
          bgm2.currentTime = 0;
          bgm2.play();
        });
        bgm2.addEventListener("ended", () => {
          bgm1.currentTime = 0;
          bgm1.play();
        });
        
        let bgmStarted = false;

        document.addEventListener("keydown", () => {
          if (bgmStarted) return;
          bgmStarted = true;
          bgm1.play();
        });



        let time_level = 1;
        let is_gameover = false;

        const stage = document.querySelector(".stage");

        const p = document.getElementById("key");
        const keys = document.getElementById("key_list");
        const minam = document.getElementById("minam");
        const fire = document.getElementById("fire");
        const may = document.getElementById("may");
        const liv = document.getElementById("liv");

        let key_list = [];
        let key_save = [];
        
        
        //cooldown
        let fire_cool = false;
        let may_cool = false;
        let liv_cool = false;
        let zena_cool = false;

        //member lvl
        let fire_lvl = 1;
        let may_lvl = 1;
        let liv_lvl = 1;
        let zena_lvl = 1;


        // ------- 스탯창 -------
        let stat_points = 10;      // 나눠줄 수 있는 총 포인트
        const STAT_MAX = 10;       // 캐릭터당 최대 레벨
            
        const stat_vars = {
            fire: [() => fire_lvl, v => { fire_lvl = v; }],
            may:  [() => may_lvl,  v => { may_lvl  = v; }],
            liv:  [() => liv_lvl,  v => { liv_lvl  = v; }],
            zena: [() => zena_lvl, v => { zena_lvl = v; }]
        };
        
        function stat_render(){
            document.getElementById("stat_points").textContent = stat_points;
            document.querySelectorAll(".stat_btn").forEach(btn => {
                const cur = stat_vars[btn.dataset.stat][0]();
                const d = Number(btn.dataset.d);
                btn.disabled = d > 0 ? (stat_points <= 0 || cur >= STAT_MAX) : (cur <= 1);
            });
            for (const name in stat_vars){
                document.getElementById("stat_" + name).textContent = "Lv." + stat_vars[name][0]();
            }
        }
        
        function stat_change(name, d){
            const [get, set] = stat_vars[name];
            const cur = get();
            if (d > 0 && (stat_points <= 0 || cur >= STAT_MAX)) return;
            if (d < 0 && cur <= 1) return;
            set(cur + d);
            stat_points -= d;
            stat_render();
        }
        
        document.querySelectorAll(".stat_btn").forEach(btn => {
            btn.addEventListener("click", () => {
                stat_change(btn.dataset.stat, Number(btn.dataset.d));
                btn.blur();   // 포커스가 남아 스페이스가 버튼을 누르는 것 방지
            });
        });
        stat_render();
        
        //invisible
        setInterval(() =>{
            if(liv_cool == false){
                liv.style.opacity = 0;
            }
            else if(liv_cool == true){
                liv.style.opacity = 1;
            }
            if(fire_cool == false){
                fire.style.opacity = 0;
            }
            else if(fire_cool == true){
                fire.style.opacity = 1;
            }
            if(may_cool == false){
                may.style.opacity = 0;
            }
            else if(may_cool == true){
                may.style.opacity = 1;
            }
            if(zena_cool == false){
                zena.style.opacity = 0;
            }
            else if(zena_cool == true){
                zena.style.opacity = 1;
            }
        })

        //pause
        let pause = true;

        
        // 미리 불러오기: 새 Image 객체로 캐시에 저장
        const preloaded = [];
        const preload_jobs = [];
            
        function preload(src){
            const img = new Image();
            img.src = src;
            preload_jobs.push(img.decode().catch(() => {}));
            preloaded.push(img);
        }
        
        Object.values(poseMap).forEach(name => preload(`${BASE}${name}.png`));
        for (let i = 1; i <= 4; i++) preload(`${BASE}fire${i}.png`);
        for (let i = 1; i <= 3; i++) preload(`${BASE}may${i}.png`);
        for (let i = 1; i <= 3; i++) preload(`${BASE}zena${i}.png`);
        for (let i = 0; i <= 3; i++) preload(`${BASE}bear_walk${i}.png`);
        preload(`${BASE}bear_hit.png`);
        preload(`${BASE}liv.png`);



        // ------- 스포트라이트 -------
        const SPOT_START = 55;    // 시작 화면 밝은 영역 반쪽 각도 (클수록 넓음)
        const SPOT_END   = 25;    // 게임 중 밝은 영역 반쪽 각도 (작을수록 좁음)
        const SPOT_TIME  = 2;     // 줄어드는 데 걸리는 시간(초)

        const spotlight = document.getElementById("spotlight");
        spotlight.style.setProperty("--half", SPOT_START + "deg");

        function spot_shrink(){
            spotlight.style.transition = `--half ${SPOT_TIME}s ease-in-out`;
            spotlight.style.setProperty("--half", SPOT_END + "deg");
        }
        function spot_reset(){
            spotlight.style.transition = `--half ${SPOT_TIME}s ease-in-out`;
            spotlight.style.setProperty("--half", SPOT_START + "deg");
        }


        // ------- 시작 화면 마퀴 -------
        const MARQUEE_SRCS = [
            { src: `${BASE}fire1.png` },
            { src: `${BASE}may1.png`, flip: true },
            { src: `${BASE}liv.png` },
            { src: `${BASE}zena1.png` }
        ];
        let MARQUEE_SPEED = 0.08;     // 1초에 화면 폭의 몇 배를 이동할지 (클수록 빠름)
        let marquee_items = [];
        let marquee_gap = 0;
        let marquee_token = 0;

        async function build_marquee(){
            const box = document.getElementById("marquee");
            if (!box) return;
            const token = ++marquee_token;
            box.textContent = "";
        
            const make_set = () => MARQUEE_SRCS.map(d => {
                const img = new Image();
                img.className = "marquee_img";
                img.draggable = false;
                img.src = d.src;
                img._flip = !!d.flip;
                box.appendChild(img);
                return img;
            });
            const wait = list => Promise.all(list.map(i => i.decode().catch(() => {})));
        
            // 1) 한 세트로 실제 너비 측정
            const first = make_set();
            await wait(first);
            if (token !== marquee_token) return;
        
            marquee_gap = window.innerWidth * 0.06;
            const W = box.clientWidth;
            const set_w = first.reduce((s, i) => s + i.offsetWidth + marquee_gap, 0);
            const max_w = Math.max(...first.map(i => i.offsetWidth));
        
            // 2) 화면을 항상 채우도록 세트 수 계산 (한 장이 빠져도 빈틈 없게 여유 확보)
            const sets = Math.max(1, Math.ceil((W + 2 * (max_w + marquee_gap)) / set_w));
            let all = [...first];
            for (let s = 1; s < sets; s++) all.push(...make_set());
            await wait(all);
            if (token !== marquee_token) return;
        
            // 3) 초기 위치: 왼쪽 → 오른쪽으로 fire, may, liv, zena 순서
            const total = all.reduce((s, i) => s + i.offsetWidth + marquee_gap, 0);
            let x = W - total + max_w + marquee_gap;
            marquee_items = all.map(el => {
                const it = { el, w: el.offsetWidth, x };
                x += it.w + marquee_gap;
                return it;
            });
        }

        let marquee_last = 0;
        let marquee_paused = false;   // 페이드 아웃이 끝난 뒤에만 true
        function marquee_loop(now){
            const box = document.getElementById("marquee");
            if (!box) return;     // 시작 화면이 사라지면 종료
            
            if (marquee_paused){                // 게임 중에는 마퀴 멈춤 (페이드 아웃 후)
                marquee_last = now;
                requestAnimationFrame(marquee_loop);
                return;
            }
        
            const dt = Math.min(now - marquee_last, 50) / 1000;
            marquee_last = now;
        
            if (marquee_items.length){
                const W = box.clientWidth;
                const move = W * MARQUEE_SPEED * dt;
            
                marquee_items.forEach(it => { it.x += move; });
            
                // 화면 오른쪽 밖으로 완전히 나간 이미지 → 맨 왼쪽 뒤로 보냄
                marquee_items.forEach(it => {
                    if (it.x > W){
                        const min_x = Math.min(...marquee_items.map(o => o.x));
                        it.x = min_x - it.w - marquee_gap;
                    }
                });
            
                marquee_items.forEach(it => {
                    it.el.style.transform =
                        `translateX(${it.x}px)` + (it.el._flip ? " scaleX(-1)" : "");
                });
            }
            requestAnimationFrame(marquee_loop);
        }

            start_btn.textContent = "START";
            stat_render();                          // 스탯 버튼 다시 활성화
            start_screen.classList.remove("hide");  // 페이드 인
        }
        //------------------------------------------------------------------
        //level-------------------------------------------------------------
        function next_lvl(){
            if(pause) return
            pause_F();
            lvl+=1;

            bear_x = 5.2;
            target.style.right = bear_x+"cqw";

            time_level = 1;

            width = 60;
            health.style.width = width+"cqw";

            clearInterval(hit_timer);
            is_hit = false;
            bear_img_frame = 0;
            bear_img.src = `https://raw.githubusercontent.com/hakgeo212543-hub/re/img/bear_walk${bear_img_frame}.png`;

            let bear_shadow = `drop-shadow(0cqw 0cqw ${lvl*2}cqw rgba(0, 0, 0, 1)) `
            bear_img.style.filter = bear_shadow.repeat(lvl);

            setTimeout(() =>{
                unpause_F();
            },1500);
        }
        


        //pause
        function pause_F(){
            if(pause) return;
            pause = true;
            clearInterval(bear_timer);
            clearInterval(bear_frame_timer);
            
        }
        function unpause_F(){
            pause = false;
            bear_moving();
            
        }


        //-------------------------------------------------------------------------


        


        //may_functions-------------------------------------------------------------
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const rand = (min, max) => min + Math.random() * (max - min);
        // const colors = ["white", "#ffe14d", "#7df9ff", "#ff9bd2"];
        

        const lines = [
            "그거 아시죠? 배가 너무 고파 밥을 너무 빨리... 그렇다고 뭐 안 먹을 순 없잖아요 소고기 뭇국랑 그 스팸이랑"           
        ];

        let run_id = 0;     
        let word_timers = [];
        function throw_word(word){
            const el = document.createElement("div");
            el.className = "word";
            el.textContent = word;

            const may_left = (may.offsetLeft / stage.clientWidth) * 100;
            el.style.left = (may_left + 10) + "cqw";
            el.style.bottom = "30cqh";
            el.style.fontSize = rand(3, 6) + "cqw";
            el.style.color = "white";
            
            stage.appendChild(el);

            const dx   = rand(30, 90);
            const peak = rand(10, 35);
            const fall = rand(-10, 40);
            const rot  = rand(-540, 540);
            const time = rand(1200, 2200);

            const anim = el.animate([
                { transform: `translate(0, 0) scale(0.4)`, opacity: 0, easing: "ease-out" },
                { transform: `translate(${dx * 0.5}cqw, ${-peak}cqh)  scale(1.1)`, opacity: 1, offset: 0.4, easing: "ease-in" },
                { transform: `translate(${dx}cqw, ${fall}cqh)  scale(1)`, opacity: 1 }
            ], { duration: time, fill: "forwards" });

            anim.onfinish = () => el.remove();
            return time;
        }

        function fly_text(sentence, gap = 300){
            const words = sentence.split(/\s+/).filter(Boolean);
            words.forEach((word, i) => {
                const id = setTimeout(() => throw_word(word), i * gap + rand(0, 150));
                word_timers.push(id);       
            });
            return words.length * gap;
        }

        async function play_lines(list, gap = 120){
            const my_id = ++run_id;    
            for (const sentence of list){
                if (my_id !== run_id) return;   
                const t = fly_text(sentence, gap);
                await sleep(t + 2300);
            }
        }

        function stop_lines(){
            run_id++;                                  // 진행 중인 play_lines 무효화
            word_timers.forEach(clearTimeout);         // 아직 안 나온 글자 취소
            word_timers = [];
            document.querySelectorAll(".word").forEach(el => el.remove());   // 날아가는 글자 제거
        }

        //liv_functions---------------------------
        const SVG_NS = "http://www.w3.org/2000/svg";

        function plasma(from, opt = {}){
            const o = {
                speed: 4,          // 앞쪽 끝이 나아가는 속도 (cqw/프레임)
                reach: 90,         // 시작점에서 얼마나 멀리 뻗을지 (cqw)
                hold: 100,         // 끝까지 뻗은 뒤 유지 시간 (ms)
                seg: 2.5,          // 꺾임 간격 (cqw), 작을수록 잘게 꺾임
                jitter: 2.5,       // 위아래로 흔들리는 폭 (cqw)
                flicker: 40,       // 모양을 새로 뽑는 주기 (ms)
                color: "#7df9ff",  // 빛 색
                width: 0.8,        // 선 굵기
                bolts: 3,          // 겹치는 줄기 수 (첫 번째는 흰색 심지)
                ...opt
            };

            // 효과가 그려질 SVG (stage와 같은 16:9 비율, 가로 100 = 100cqw)
            const svg = document.createElementNS(SVG_NS, "svg");
            svg.setAttribute("viewBox", "0 0 100 56.25");
            svg.setAttribute("preserveAspectRatio", "none");
            svg.style.cssText =
                "position:absolute;left:0;top:0;width:100%;height:100%;" +
                "pointer-events:none;overflow:visible;z-index:12;" +
                `filter:drop-shadow(0 0 1cqw ${o.color});`;

            const lines = [];
            for (let i = 0; i < o.bolts; i++){
                const pl = document.createElementNS(SVG_NS, "polyline");
                pl.setAttribute("fill", "none");
                pl.setAttribute("stroke", i === 0 ? "#fff" : o.color);
                pl.setAttribute("stroke-width", i === 0 ? o.width * 0.5 : o.width);
                pl.setAttribute("stroke-linejoin", "round");
                pl.setAttribute("stroke-linecap", "round");
                pl.setAttribute("opacity", i === 0 ? 1 : 0.7);
                svg.appendChild(pl);
                lines.push(pl);
            }
            stage.appendChild(svg);

            let stopped = false;
            let resolve_done;
            const done = new Promise(r => resolve_done = r);

            function finish(){
                stopped = true;
                svg.remove();
                resolve_done();
            }

            // liv의 현재 위치에서 시작점 계산 (매 프레임 따라감)
            function start_point(){
                const s = stage.getBoundingClientRect();
                const r = from.getBoundingClientRect();
                return {
                    x: (r.left + r.width / 2 - s.left) / s.width * 100,
                    y: (r.top + r.height / 2 - s.top) / s.width * 100   // viewBox 높이 56.25 기준
                };
            }

            let length = 0;                 // 현재 뻗은 길이
            let reached_at = 0;             // 끝까지 뻗은 시각
            let last_shape = 0;
            let shapes = [];                // 줄기별 jitter 값 (flicker 주기마다 갱신)

            function new_shapes(count){
                shapes = lines.map(() =>
                    Array.from({ length: count }, () => rand(-1, 1)));
            }

            function frame(now){
                if (stopped) return;
                if (is_gameover){ finish(); return; }

                const p = start_point();

                // 매 프레임 reach를 새로 읽음 (숫자도, 함수도 가능)
                const reach = Math.max(0, typeof o.reach === "function" ? o.reach() : o.reach);

                if (length < reach){
                    length = Math.min(length + o.speed, reach);   // 모자라면 뻗음
                    reached_at = 0;                               // 아직 다 안 뻗음
                } else {
                    length = reach;                               // 넘치면 즉시 줄임
                    if (!reached_at) reached_at = now;            // 다 뻗은 시각 기록
                }

                const count = Math.ceil(length / o.seg) + 1;
                if (now - last_shape > o.flicker || shapes[0].length < count){
                    new_shapes(count);
                    last_shape = now;
                }

                lines.forEach((pl, b) => {
                const pts = [];
                    for (let i = 0; i < count; i++){
                        const x = p.x + Math.min(i * o.seg, length);
                        const y = p.y + (i === 0 ? 0 : shapes[b][i] * o.jitter);
                        pts.push(x.toFixed(2) + "," + y.toFixed(2));
                    }
                    pl.setAttribute("points", pts.join(" "));
                });

                if (reached_at){
                    const t = now - reached_at;
                    if (t > o.hold){ finish(); return; }
                    svg.style.opacity = t > o.hold - 200 ? (o.hold - t) / 200 : 1;
                } else {
                    svg.style.opacity = 1;                        // 다시 뻗는 중이면 선명하게
                }
                requestAnimationFrame(frame);
            }

            new_shapes(1);
            requestAnimationFrame(frame);

            return { done, stop: finish, opt: o };
        }
        function reach_to(from, target){
            const s = stage.getBoundingClientRect();
            const f = from.getBoundingClientRect();
            const t = target.getBoundingClientRect();
            return (t.left - (f.left + f.width / 2)) / s.width * 100 + 3;   // cqw
        }
        //-------------------------------------------------
        //zena function------------------------------------
        function slash(target, count = 3, interval = 120) {
          const parent = stage;
          const pr = parent.getBoundingClientRect();
          const tr = target.getBoundingClientRect();
                
          // bear 중심 좌표와 너비를 부모 기준 %로 변환
          const cx = ((tr.left - pr.left + tr.width / 2) / pr.width) * 100;
          const cy = ((tr.top - pr.top + tr.height / 2) / pr.height) * 100;
          const w = (tr.width / pr.width) * 100;
                
          for (let i = 0; i < count; i++) {
            setTimeout(() => {
              const s = document.createElement("div");
              const angle = (Math.random() < 0.5 ? -1 : 1) * (20 + Math.random() * 50);
              const dx = (Math.random() - 0.5) * w * 0.5; // bear 근처에서 살짝 흩어짐
              const dy = (Math.random() - 0.5) * w * 0.5;
            
              Object.assign(s.style, {
                position: "absolute",
                left: cx + dx + "%",
                top: cy + dy + "%",
                width: w * 1.4 + "%",
                aspectRatio: "16 / 1",
                borderRadius: "50%",
                background: "linear-gradient(90deg, transparent, #BFFFE6 50%, transparent)",
                filter: "drop-shadow(0 0 6px #8cf)",
                pointerEvents: "none",
                zIndex: 999,
              });
              parent.appendChild(s);
            
              s.animate(
                [
                  { transform: `translate(-50%,-50%) rotate(${angle}deg) scaleX(0.2)`, clipPath: "inset(0 100% 0 0)", opacity: 1 },
                  { transform: `translate(-50%,-50%) rotate(${angle}deg) scaleX(1)`,   clipPath: "inset(0 0 0 0)",    opacity: 1, offset: 0.4 },
                  { transform: `translate(-50%,-50%) rotate(${angle}deg) scaleX(1.1)`, clipPath: "inset(0 0 0 0)",    opacity: 0 },
                ],
                { duration: 280, easing: "ease-out" }
              ).onfinish = () => s.remove();
            
              // 맞는 느낌: bear 살짝 흔들기
              target.animate(
                [{ translate: "0 0" }, { translate: "-0.6cqw 0" }, { translate: "0.6cqw 0" }, { translate: "0 0" }],
                { duration: 120 }
              );
              kb(1.5*zena_lvl);
            }, i * interval);
          }
        }
    </script>
