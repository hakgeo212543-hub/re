<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>test</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="stage">
    <div class="text">
        <p id="key">key:</p>

        <p id="key_list">list:</p>
    </div>
    

    <img
        class="bear"
        src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/bear.png"
    >
    <img
        class="minam" 
        id="minam"
        src="https://raw.githubusercontent.com/hakgeo212543-hub/re/img/a.png"
    >
    </div>
    <script>
        const BASE = "https://raw.githubusercontent.com/hakgeo212543-hub/re/img/";
        const poseMap = {
            KeyA: "a",
            KeyS: "s",
            KeyK: "k",
            KeyL: "l",
            Space: "space"
        };

        const p = document.getElementById("key");
        const keys = document.getElementById("key_list");
        const minam = document.getElementById("minam");
        let key_list = [];

        // 미리 불러오기: 새 Image 객체로 캐시에 저장
        Object.values(poseMap).forEach(name => {
            const img = new Image();
            img.src = `${BASE}${name}.png`;
        });

        function popImage(target) {
            const el = typeof target === "string" ? document.getElementById(target) : target;
            if (!el) return;
            el.classList.remove("pop");
            void el.offsetWidth;
            el.classList.add("pop");
        }

        document.addEventListener("keydown", function (event) {
            if (event.repeat) return;                  // 꾹 누름 방지
            if (event.code === "Space") event.preventDefault();

            p.textContent = `key:${event.key}`;

            if (event.code === "Space") {
                key_list = [];
            } else {
                key_list.push(event.key);
            }
            keys.textContent = "list:" + key_list;

            const pose = poseMap[event.code];          // 한글/대문자 상태에서도 동작
            if (pose) {
                popImage(minam);
                minam.src = `${BASE}${pose}.png`;
            }
        });
    </script>
</body>
</html>
